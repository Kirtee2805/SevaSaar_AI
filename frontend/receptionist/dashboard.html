<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptionist Dashboard • SevaSaar AI</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/receptionist.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-wrapper">
        <div class="brand-icon-box" style="background:linear-gradient(135deg, #059669, #10b981);">👥</div>
        <div class="brand-text">
          <h1>SevaSaar AI <span class="brand-badge" style="background:#ecfdf5; color:#047857; border-color:#a7f3d0;">Receptionist</span></h1>
          <p class="brand-tagline">OPD Queue Management & Token Tracking</p>
        </div>
      </a>
      <a href="/" class="btn-secondary">Switch Role / Back to Home</a>
    </div>
  </header>

  <main class="main-content">
    <div class="container" id="receptionist-app-root"></div>
  </main>

  <script type="module">
    import { ReceptionistDashboard } from '/js/receptionist.js';
    const root = document.getElementById('receptionist-app-root');
    const dashboard = new ReceptionistDashboard(root);
    dashboard.init();
  </script>
</body>
</html>
