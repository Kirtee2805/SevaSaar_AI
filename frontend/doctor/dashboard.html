<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard • SevaSaar AI</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/doctor.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-wrapper">
        <div class="brand-icon-box" style="background:linear-gradient(135deg, #4f46e5, #6366f1);">🩺</div>
        <div class="brand-text">
          <h1>SevaSaar AI <span class="brand-badge" style="background:#eef2ff; color:#4338ca; border-color:#c7d2fe;">Doctor Console</span></h1>
          <p class="brand-tagline">Clinical Triage & Patient Summary Inspection</p>
        </div>
      </a>
      <a href="/" class="btn-secondary">Switch Role / Back to Home</a>
    </div>
  </header>

  <main class="main-content">
    <div class="container" id="doctor-app-root"></div>
  </main>

  <script type="module">
    import { DoctorDashboard } from '/js/doctor.js';
    const root = document.getElementById('doctor-app-root');
    const dashboard = new DoctorDashboard(root);
    dashboard.init();
  </script>
</body>
</html>
